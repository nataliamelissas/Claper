# Interim image for slides.talitechtutoring.com, built from a v3.0.0 base plus the
# commits under review in ClaperCo/Claper#251. It exists only until that PR merges
# and upstream cuts a release; then the deployment pins ghcr.io/claperco/claper
# again and this workflow and its branch are deleted.
name: TaliTech interim image

on:
  push:
    branches: ["deploy/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/claper
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Cloudflare Container runs linux/amd64 only, so arm64 is not built.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_METADATA=${{ steps.meta.outputs.json }}

      - name: Digest to pin in apps/slides/Dockerfile
        run: echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
